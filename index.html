<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

<script>
  (function () {
    try {
      var t = {"palette":{"light":{"alt":"#e6ebe8","ink":"#1a2320","line":"rgba(0, 0, 0, 0.14)","brand":"#1a2320","field":"rgba(0, 0, 0, 0.08)","focus":"#00ccfc","panel":"rgba(255, 255, 255, 0.88)","quiet":"#edf1ef","altInk":"#1a2320","canvas":"#f2f5f3","danger":"#a20015","brandInk":"#ffffff","floating":"#ffffff","panelInk":"#232d29","quietInk":"#5f6b66","dangerInk":"#ffffff","highlight":"#00ccfc","floatingInk":"#1a2320","highlightInk":"#06212a"},"dark":{"alt":"#1f2b26","ink":"#ffffff","line":"rgba(255, 255, 255, 0.14)","brand":"#ffffff","field":"rgba(255, 255, 255, 0.12)","focus":"#00ccfc","panel":"rgba(0, 0, 0, 0.7)","quiet":"#1c2622","altInk":"#e6e8e7","canvas":"#25332e","danger":"#a20015","brandInk":"#0a0a0a","floating":"#1a2420","panelInk":"#c5c7c6","quietInk":"#a9b4ad","dangerInk":"#ffffff","highlight":"#00ccfc","floatingInk":"#ffffff","highlightInk":"#06212a"}},"fonts":{"sans":"\"Open Sans\", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif","serif":"\"Open Sans\", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif","display":"\"Open Sans\", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif"},"radius":"0px","mode":"dark"};
      var mode = null;
      try {
        var stored = JSON.parse(localStorage.getItem('rccswebcomp-ui') || 'null');
        mode = stored && stored.state && stored.state.theme;
      } catch (e) { /* ignore */ }
      if (!mode) mode = t.mode;
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var html = document.documentElement;
      html.classList.remove('light', 'dark');
      html.classList.add(dark ? 'dark' : 'light');
      var colors = dark ? t.palette.dark : t.palette.light;
      Object.keys(colors).forEach(function (key) {
        var name = key.replace(/([A-Z])/g, '-$1').toLowerCase();
        html.style.setProperty('--' + name, colors[key]);
      });
      html.style.setProperty('--font-sans', t.fonts.sans);
      html.style.setProperty('--font-serif', t.fonts.serif);
      html.style.setProperty('--font-display', t.fonts.display);
      html.style.setProperty('--radius', t.radius);
    } catch (e) { /* never block first paint */ }
  })();
</script>
<!-- theme:end -->
  </head>

    <div id="root"></div>

</html>
